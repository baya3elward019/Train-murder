<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>القطار الأخير</title>
<meta name="description" content="لعبة تحقيق وغموض سينمائية في قطار ليلي. خمس ركاب، ساعة ونص، وقاتل واحد.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app" dir="rtl">
  <canvas id="stage"></canvas>

  <header id="hud" hidden>
    <div class="clock">
      <b id="clk">١٠:٠٠</b>
      <span id="left"></span>
      <div id="track" aria-hidden="true"><i></i></div>
    </div>
    <div class="where">
      <span id="act"></span>
      <strong id="loc"></strong>
      <p id="obj"></p>
    </div>
    <div class="hbtn">
      <button id="bFile">ملف القضية<i id="fileDot" hidden></i></button>
      <button id="bAcc" class="danger">اتهام</button>
      <button id="bPause" aria-label="إيقاف مؤقت">❙❙</button>
    </div>
  </header>

  <nav id="mini" hidden aria-label="خريطة القطر"></nav>
  <button id="navL" class="nav" hidden aria-label="العربة اللي قدام">‹</button>
  <button id="navR" class="nav" hidden aria-label="العربة اللي ورا">›</button>

  <div id="toasts" aria-live="polite"></div>
  <div id="card" hidden><span></span><h2></h2></div>

  <section id="dlg" hidden>
    <canvas id="port" width="150" height="170"></canvas>
    <div class="dbody">
      <h3 id="dn"></h3>
      <p id="dt"></p>
      <div id="dch"></div>
    </div>
    <button id="dnext" aria-label="كمّل">▾</button>
  </section>

  <div id="sheet" hidden></div>
  <div id="menu"></div>
</div>

<script src="js/engine.js"></script>
<script src="js/audio.js"></script>
<script src="cases/case01.js"></script>
<script src="js/scene.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
